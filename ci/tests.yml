name: Pruebas
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logica-js:
    name: Pruebas de lógica y seguridad estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/js/*.test.mjs
  base-de-datos:
    name: Pruebas de la base de datos (PostgreSQL real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Instalar el cliente de PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Aplicar las migraciones y ejecutar las pruebas SQL
        run: bash tests/sql/run.sh
