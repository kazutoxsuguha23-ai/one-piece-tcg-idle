<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Política de seguridad de contenido: la web solo puede cargar scripts propios y conectarse a tu Supabase
         (y, si lo creas, a tu proxy de imágenes en workers.dev). Las imágenes de cartas pueden venir de cualquier https.
         Si algún día algo deja de cargar y en la consola (F12) aparece "Content Security Policy", este es el sitio a revisar. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://*.workers.dev; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>One Piece TCG Idle</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
