name: Mantener Supabase activo
# El plan gratuito de Supabase pausa el proyecto tras una semana sin actividad.
# Dos veces por semana se hace una consulta de lectura (solo a game_config, que es pública).
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Consulta de lectura a Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" src/config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY = '\K[^']+" src/config.js)
          CODIGO=$(curl -s -o /tmp/respuesta.json -w '%{http_code}' "$URL/rest/v1/game_config?select=key&limit=1" -H "apikey: $KEY")
          echo "Respuesta HTTP: $CODIGO"
          if [ "$CODIGO" != "200" ]; then
            echo "Supabase no respondió bien. Posible pausa o clave incorrecta."
            head -c 300 /tmp/respuesta.json
            exit 1
          fi
